{% extends "base.html" %}{% block title %}Đăng nhập Admin{% endblock %}
{% block content %}<div class="card login"><h2>Đăng nhập quản trị</h2><p class="muted">Chỉ dành cho quản trị viên bãi xe.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p><label>Tên đăng nhập</label><input name="username" autocomplete="username" required style="width:100%"></p>
<p><label>Mật khẩu</label><input type="password" name="password" autocomplete="current-password" required style="width:100%"></p>
<button style="width:100%">Đăng nhập</button></form></div>{% endblock %}
