<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Parking Admin{% endblock %}</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#18212f;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}
header{background:#10243b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none}.wrap{max-width:1400px;margin:24px auto;padding:0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 12px #132b4510}.num{font-size:30px;font-weight:700;margin-top:8px}
input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#1769aa;color:white;border:0}button.danger{background:#b42318}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5eaf0;vertical-align:top}th{background:#eaf0f7}
img.thumb{width:120px;height:78px;object-fit:cover;border-radius:6px;background:#e5e7eb}.table-wrap{overflow:auto;border-radius:10px}
.flash{padding:12px;margin:10px 0;border-radius:8px;background:#e8f4ff}.flash.error{background:#fee4e2}.login{max-width:420px;margin:8vh auto}
small{color:#667085}.inline{display:inline}.muted{color:#667085}
</style></head><body>
<header><a href="{{ url_for('admin_dashboard') }}"><strong>Parking Admin</strong> · Quản lý xe ra/vào</a>
{% if current_user.is_authenticated %}<form class="inline" method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Đăng xuất</button></form>{% endif %}</header>
<div class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</div></body></html>
